[workspace]
resolver = "2"
members = ["argb_core", "configurator_gui", "thermal_daemon"]

[workspace.package]
version = "1.4.0"
edition = "2021"

[workspace.dependencies]
argb_core = { path = "argb_core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
